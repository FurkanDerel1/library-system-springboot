<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container"><a class="navbar-brand" href="/books">Library System</a></div>
    </nav>
    <div class="container">
        <div class="card shadow-sm p-4">
            <h2 class="mb-4 text-center">Book Inventory</h2>
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr><th>ID</th><th>Title</th><th>Author</th><th>ISBN</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.id}">1</td>
                        <td th:text="${book.title}" class="fw-bold">Title</td>
                        <td th:text="${book.author}">Author</td>
                        <td th:text="${book.isbn}">ISBN</td>
                        <td>
                            <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                            <a th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure?');">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="text-end mt-3">
                <a href="/books/new" class="btn btn-success">+ Add New Book</a>
            </div>
        </div>
    </div>
</body>
</html>
